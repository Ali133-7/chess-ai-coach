name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUDIO_DB: /tmp/chess-ci/studio.sqlite3
      CHESS_KNOWLEDGE_DB: /tmp/chess-ci/knowledge.sqlite3
      DATABASE_PATH: /tmp/chess-ci/legacy.sqlite3
      STOCKFISH_PATH: /usr/games/stockfish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: pip install -r requirements.txt
      - run: python scripts/prepare_public_data.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - run: python -m unittest discover -s studio/tests -p 'test_*.py' -q
      - run: npm ci
      - run: npm test
