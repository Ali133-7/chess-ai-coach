name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: legacy-and-providers
            modules: test_coach_pro test_v5_deep test_play_groq test_providers
          - group: learning
            modules: test_curriculum test_daily_exercises test_placement_plans
          - group: knowledge
            modules: test_colors_traps test_knowledge test_locale test_opening_study
          - group: masters-and-teacher
            modules: test_master_games test_teacher_v7_integration test_training_teacher
          - group: studio
            modules: studio
          - group: control-and-payments
            modules: test_control_center test_google_play test_database_export test_security_review
          - group: analysis-and-adaptation
            modules: test_analysis_runtime test_analysis_engine test_adaptive_grounding
          - group: reliability-and-security
            modules: test_account_security test_reliability_analysis test_encrypted_backup test_release_promotion
    env:
      PYTHONPATH: .:tests
      STUDIO_DB: /tmp/chess-ci/studio.sqlite3
      CHESS_KNOWLEDGE_DB: /tmp/chess-ci/knowledge.sqlite3
      DATABASE_PATH: /tmp/chess-ci/legacy.sqlite3
      STOCKFISH_PATH: /usr/games/stockfish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: pip install -r requirements.lock
      - run: python scripts/prepare_public_data.py
      - if: matrix.group != 'studio'
        run: python -m unittest ${{ matrix.modules }} -q
      - if: matrix.group == 'studio'
        run: python -m unittest discover -s studio/tests -p 'test_*.py' -q
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - run: pip-audit -r requirements.lock
      - run: bandit -r studio scripts deploy main.py -lll
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - name: Build source-pinned candidate image
        run: docker build --build-arg "APP_REVISION=$GITHUB_SHA" -t chess-candidate:ci .
      - name: Verify real image startup and isolated additive migration
        run: |
          mkdir -p /tmp/chess-release-seed /tmp/chess-release-stage
          docker run --rm --network none --mount type=bind,src=/tmp/chess-release-seed,dst=/studio-data chess-candidate:ci python -c "from studio.app import start; start()"
          python -c "from pathlib import Path; from scripts.promote_release import stage; print(stage('chess-candidate:ci',{'studio':'/tmp/chess-release-seed/studio.sqlite3','knowledge':'/tmp/chess-release-seed/knowledge.sqlite3'},Path('/tmp/chess-release-stage')))"
  load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: python scripts/prepare_public_data.py
      - run: python scripts/load_test.py --levels 10 --seconds 2 --output load-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-smoke
          path: load-smoke.json
          retention-days: 7
